<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Love Question</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #ffe6f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    .heart {
      color: #e0245e;
      font-size: 2.5rem;
      animation: beat 1s infinite;
      margin: 0 0.15rem;
      user-select: none;
    }
    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.3);
      }
    }
    #noBtn {
      position: relative;
      transition: top 0.2s ease, left 0.2s ease;
    }
  </style>
</head>
<body>
  <main
    class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 sm:p-8 text-center relative overflow-hidden"
    role="main"
    aria-live="polite"
  >
    <h1
      class="text-3xl sm:text-4xl text-pink-600 font-['Pacifico'] mb-6 select-none"
      aria-label="With Love"
    >
      With Love ❤️
    </h1>
    <p
      id="questionText"
      class="text-base sm:text-lg text-gray-700 mb-8 min-h-[3rem] flex items-center justify-center"
      aria-describedby="instructions"
    >
      Do you love me?
    </p>
    <div id="buttons" class="flex justify-center items-center gap-4 sm:gap-6 relative min-h-[60px]">
      <button
        id="yesBtn"
        class="bg-pink-500 hover:bg-pink-600 active:bg-pink-700 text-white font-semibold py-3 px-6 sm:px-8 rounded-full shadow-md focus:outline-none focus:ring-4 focus:ring-pink-300 transition z-10"
        aria-label="Yes, I love you"
      >
        Yes
      </button>
      <button
        id="noBtn"
        class="bg-gray-200 hover:bg-gray-300 active:bg-gray-400 text-gray-800 font-semibold py-3 px-6 sm:px-8 rounded-full shadow-md focus:outline-none focus:ring-4 focus:ring-gray-300 transition z-10"
        aria-label="No, I don't love you"
      >
        No
      </button>
    </div>
    <div
      id="heartsContainer"
      class="mt-6 flex flex-wrap justify-center opacity-0 pointer-events-none transition-opacity duration-500"
      aria-hidden="true"
    ></div>
  </main>

  <script>
    const questionText = document.getElementById('questionText');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const buttons = document.getElementById('buttons');
    const heartsContainer = document.getElementById('heartsContainer');
    const main = document.querySelector('main');

    const questions = [
      'Do you love me?',
      'Are you sure you love me?',
      'Will you love me forever?',
      'Do you want to be with me always?',
      'Is your heart mine?',
      'Can I be your everything?',
      'Will you say yes again?',
      'Do you love me more than anything?',
      'Will you never leave me?',
      'Is our love forever?',
    ];

    let currentQuestionIndex = 0;
    let noClickCount = 0;
    let noButtonMoved = false;

    function showHearts() {
      heartsContainer.innerHTML = '';
      heartsContainer.style.opacity = '1';
      heartsContainer.style.pointerEvents = 'auto';

      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('span');
        heart.classList.add('heart');
        heart.style.animationDelay = `${i * 0.1}s`;
        heart.textContent = '❤️';
        heartsContainer.appendChild(heart);
      }
    }

    function resetHearts() {
      heartsContainer.innerHTML = '';
      heartsContainer.style.opacity = '0';
      heartsContainer.style.pointerEvents = 'none';
    }

    function askQuestion() {
      if (currentQuestionIndex < questions.length) {
        questionText.textContent = questions[currentQuestionIndex];
        resetHearts();
        buttons.style.display = 'flex';
        yesBtn.style.display = 'inline-block';
        noBtn.style.display = 'inline-block';
        noBtn.style.position = 'relative';
        noBtn.style.top = '0px';
        noBtn.style.left = '0px';
        noButtonMoved = false;
      } else {
        questionText.textContent = 'I know you love me ❤️';
        buttons.style.display = 'none';
        showHearts();
      }
    }

    yesBtn.addEventListener('click', () => {
      currentQuestionIndex++;
      noClickCount = 0;
      if (currentQuestionIndex === questions.length) {
        questionText.textContent = 'I know you love me ❤️';
        buttons.style.display = 'none';
        showHearts();
      } else {
        askQuestion();
      }
    });

    noBtn.addEventListener('click', (e) => {
      // Prevent default behavior on mobile click/tap if needed
      noClickCount++;
      if (noClickCount <= 4) {
        const noMessages = [
          'Please say yes, I love you ❤️ Do you love me?',
          'I really want to hear yes ❤️ Do you love me?',
          'Your yes means the world to me ❤️ Do you love me?',
          'I believe in us ❤️ Please say yes!',
          'Pretty please say yes ❤️ Do you love me?',
        ];
        questionText.textContent = noMessages[noClickCount - 1] || noMessages[noMessages.length - 1];
        resetHearts();
        buttons.style.display = 'flex';
      } else {
        questionText.textContent = 'Please, just say yes ❤️';
        yesBtn.style.display = 'inline-block';
        noBtn.style.display = 'inline-block';
        noBtn.style.position = 'absolute';
        noBtn.style.top = '20px';
        noBtn.style.left = '20px';
        noButtonMoved = true;
        moveButtonRandomly();
      }
    });

    function moveButtonRandomly() {
      if (!noButtonMoved) return;
      const mainRect = main.getBoundingClientRect();
      const rect = noBtn.getBoundingClientRect();

      const padding = 20;
      const maxLeft = mainRect.width - rect.width - padding;
      const maxTop = mainRect.height - rect.height - padding;

      const randomLeft = Math.max(padding, Math.random() * maxLeft);
      const randomTop = Math.max(80, Math.random() * maxTop); // Keep clear of heading

      noBtn.style.left = `${randomLeft}px`;
      noBtn.style.top = `${randomTop}px`;
    }

    // Desktop hover escape
    main.addEventListener('mousemove', (e) => {
      if (!noButtonMoved) return;
      const rect = noBtn.getBoundingClientRect();
      const btnCenterX = rect.left + rect.width / 2;
      const btnCenterY = rect.top + rect.height / 2;
      const distance = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);

      if (distance < 80) {
        moveButtonRandomly();
      }
    });

    // Mobile touch escape
    main.addEventListener('touchstart', (e) => {
      if (!noButtonMoved) return;
      const touch = e.touches[0];
      const rect = noBtn.getBoundingClientRect();
      const btnCenterX = rect.left + rect.width / 2;
      const btnCenterY = rect.top + rect.height / 2;
      const distance = Math.hypot(touch.clientX - btnCenterX, touch.clientY - btnCenterY);

      if (distance < 90) {
        moveButtonRandomly();
      }
    });

    askQuestion();
  </script>
</body>
</html>
